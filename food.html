<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Food Selection</title>
    <link rel="stylesheet" href="food.css" />
  </head>
  <body>
    <div id="foodquestion">
      <b>What food would you like to eat?</b>
    </div>

    <div class="food-selection">
      <div class="food-item">
        <img src="burger.jpg" alt="Burger" />
        <label
          ><input
            type="checkbox"
            name="food"
            value="Burgers"
          />
          burgers</label
        >
      </div>
      <div class="food-item">
        <img src="waffle.jpg" alt="waffel" />
        <label
          ><input type="checkbox" name="food" value="waffel" /> waffel</label
        >
      </div>
      <div class="food-item">
        <img src="chocolate.jpg" alt="choclate" />
        <label
          ><input type="checkbox" name="food" value="chocolate" /> Chocolate</label
        >
      </div>
      <div class="food-item">
        <img src="pizza.jpg" alt="pizza" />
        <label><input type="checkbox" name="food" value="pizza" /> pizza</label>
      </div>
      <div class="food-item">
        <img src="milkshake.jpg" alt="milkshake" />
        <label><input type="checkbox" name="food" value="milkshake" /> milkshake</label>
      </div>
      <div class="food-item">
        <img src="momo.jpg" alt="momos" />
        <label><input type="checkbox" name="food" value="momos" /> Momos</label>
      </div>
    </div>
    <button class="button" onclick="location.href='dessert.html'">
      Continue Hihihhh... 
    </button>
  </body>
</html>
